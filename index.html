<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grade 4’s Unit Article Hub</title>
<style>
/* ===== COLORS AND FONTS: change these and the whole site changes ===== */
:root{
  --bg-1:#6fb1e8; --bg-2:#2f78c4;
  --blue-1:#9fd0ff; --blue-2:#3d8fe0; --blue-3:#1f6fc9; --blue-edge:#1b5aa5;
  --window:#ffffff; --bar-1:#f4f4f4; --bar-2:#cfcfcf; --text:#1d2733; --text-soft:#5b6877;
  --font:"Lucida Grande","Trebuchet MS","Segoe UI",Verdana,sans-serif;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);overflow:hidden;
  background:repeating-linear-gradient(90deg,rgba(255,255,255,.07) 0 2px,transparent 2px 6px),linear-gradient(160deg,var(--bg-1),var(--bg-2))}
:focus-visible{outline:3px solid #ffd54a;outline-offset:2px}
body.dragging iframe{pointer-events:none}
body.dragging{user-select:none}

/* ===== TOP MENU BAR ===== */
#menu{position:fixed;top:0;left:0;right:0;height:34px;display:flex;align-items:center;gap:8px;padding:0 12px;z-index:9999;
  background:linear-gradient(#fdfdfd,#d9d9d9);border-bottom:1px solid #8d8d8d;box-shadow:0 2px 8px rgba(0,0,0,.25);font-size:15px}
#menu b{font-size:16px;margin-right:8px}
#menu .clock{margin-left:auto;color:var(--text-soft)}
.menu-btn{all:unset;cursor:pointer;padding:4px 12px;border-radius:999px;font-size:14px}
.menu-btn:hover,.menu-btn:focus-visible{background:linear-gradient(var(--blue-1),var(--blue-3));color:#fff}

/* ===== DESKTOP AND ICONS ===== */
#desk{position:absolute;inset:34px 0 0 0;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,110px);
  grid-auto-rows:124px;gap:14px;align-content:start;justify-content:start}
.icon{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:6px;border-radius:12px;text-align:center;font-size:14px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.icon .img{width:68px;height:68px;border-radius:18px;display:grid;place-items:center;font-size:36px;
  background:linear-gradient(var(--blue-1),var(--blue-2) 50%,var(--blue-3) 51%,var(--blue-2));
  border:1px solid var(--blue-edge);box-shadow:inset 0 2px 0 rgba(255,255,255,.7),0 4px 10px rgba(0,0,0,.35);transition:transform .15s}
.icon:hover .img,.icon:focus-visible .img{transform:scale(1.08)}
.icon:active .img{transform:scale(.96)}
.icon.small{color:var(--text);text-shadow:none}
.icon.small .img{width:56px;height:56px;font-size:28px;border-radius:15px}

.corner{position:absolute;bottom:14px;width:104px}
.corner.left{left:24px}.corner.right{right:24px}
/* ===== CREDITS FILE ===== */
pre.ascii{margin:0;font:13px/1.15 ui-monospace,Menlo,Consolas,"Courier New",monospace;overflow-x:auto}
.line{white-space:pre-line}
.big{font-size:20px !important;text-align:center;padding:14px 0}
/* ===== INVESTIGATION JOURNAL ===== */
.jnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.jnav strong{flex:1;text-align:center;font-size:17px;min-width:90px}
.jfield{display:flex;flex-direction:column;gap:4px}
.jfield label{font-size:21px;font-weight:600}
.jhint{font-size:15px;color:var(--text-soft)}
.jfield textarea{width:100%;min-height:64px;resize:none;overflow:hidden;padding:10px 14px;font:20px/1.4 var(--font);color:var(--text);
  border:2px solid #9aa5b1;border-radius:14px;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.jfield textarea:focus{outline:none;border-color:var(--blue-3);box-shadow:inset 0 2px 4px rgba(0,0,0,.12),0 0 0 3px rgba(61,143,224,.35)}
.jfield input{width:100%;padding:10px 14px;font:20px/1.4 var(--font);color:var(--text);border:2px solid #9aa5b1;border-radius:14px;background:#fff;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.jfield input:focus{outline:none;border-color:var(--blue-3);box-shadow:inset 0 2px 4px rgba(0,0,0,.12),0 0 0 3px rgba(61,143,224,.35)}
.jfoot{display:flex;gap:10px;flex-wrap:wrap;padding-top:4px}
.jfoot .btn{font-size:16px;padding:10px 18px}
/* ===== WINDOWS ===== */
.win{position:absolute;display:flex;flex-direction:column;background:var(--window);border-radius:var(--radius);
  border:1px solid #6d7b8a;overflow:hidden;box-shadow:0 18px 40px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.5) inset;animation:open .18s ease-out}
@keyframes open{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.win[hidden]{display:none}
.win.back{filter:saturate(.8) brightness(.97)}
.win.full{inset:0 !important;width:auto !important;height:auto !important;border-radius:0}
.bar{display:flex;align-items:center;gap:8px;padding:9px 12px;cursor:grab;touch-action:none;user-select:none;flex:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.6) 0 1px,transparent 1px 3px),linear-gradient(var(--bar-1),var(--bar-2));
  border-bottom:1px solid #8f8f8f}
.bar:active{cursor:grabbing}
.bar h2{flex:1;margin:0;text-align:center;font-size:15px;font-weight:600;padding-right:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dots{display:flex;gap:7px}
.dot{all:unset;width:16px;height:16px;border-radius:50%;cursor:pointer;box-shadow:inset 0 -2px 3px rgba(0,0,0,.3),inset 0 2px 2px rgba(255,255,255,.8),0 0 0 1px rgba(0,0,0,.35)}
.dot.x{background:radial-gradient(circle at 50% 30%,#ff9a8f,#e5392b)}
.dot.m{background:radial-gradient(circle at 50% 30%,#ffe69a,#eba91a)}
.dot.z{background:radial-gradient(circle at 50% 30%,#b6f0a0,#3fb62c)}
.dot:hover{filter:brightness(1.15)}
.body{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0}
.body p{margin:0;line-height:1.5;font-size:16px}
.soft{color:var(--text-soft)}
.files{display:grid;grid-template-columns:repeat(auto-fill,100px);gap:10px}
.grip{position:absolute;right:0;bottom:0;width:26px;height:26px;cursor:nwse-resize;touch-action:none;z-index:3;
  background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.28) 50% 56%,transparent 56% 66%,rgba(0,0,0,.28) 66% 72%,transparent 72%)}

/* ===== PAGE VIEWER (articles, videos) ===== */
.viewer .body{padding:0;gap:0}
.tools{display:flex;gap:8px;align-items:center;padding:8px 10px;background:linear-gradient(#f7f9fb,#e3e9ef);border-bottom:1px solid #b5c0cc;flex:none}
.tools .addr{flex:1;min-width:0;padding:6px 12px;border-radius:999px;border:1px solid #9aa5b1;background:#fff;font-size:13px;color:var(--text-soft);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:inset 0 1px 3px rgba(0,0,0,.15)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;padding:7px 14px;border-radius:999px;font-size:14px;font-weight:600;white-space:nowrap;
  color:#fff;text-shadow:0 -1px 0 rgba(0,0,0,.35);border:1px solid var(--blue-edge);
  background:linear-gradient(var(--blue-1),var(--blue-2) 50%,var(--blue-3) 51%,var(--blue-2));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.65),0 2px 5px rgba(0,0,0,.25);transition:transform .1s,filter .1s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.light{color:var(--text);text-shadow:none;border-color:#9aa5b1;background:linear-gradient(#fff,#e6ebf0 50%,#d5dce4 51%,#e9eef3)}
iframe{flex:1;width:100%;min-height:0;border:0;background:#fff}
.hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--text-soft);background:#f3f6f9;border-top:1px solid #d3dbe3}
.bigbtn{display:inline-block;margin-top:10px;font-size:18px;padding:12px 26px}
.holder{margin:auto;max-width:340px;text-align:center;padding:24px;color:var(--text-soft);line-height:1.5}

/* ===== PICTURE VIEWER (picture + read-only subtitle) ===== */
.pic{flex:1;min-height:0;display:flex;flex-direction:column;background:#fff}
.pic .frame{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#eef2f6;padding:10px}
.pic .frame img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.pic .caption{flex:none;max-height:38%;overflow:auto;padding:14px 20px;font-size:18px;line-height:1.55;border-top:1px solid #d3dbe3;outline:none;background:#fff}
.pic .caption:empty{display:none}

/* ===== TYPING PRACTICE ===== */
.icon.typing{grid-column-start:1}
.tword{font:600 44px/1.3 ui-monospace,Menlo,Consolas,monospace;text-align:center;letter-spacing:4px;padding:6px 0;white-space:pre-wrap;word-break:break-word}
.tword.long{font-size:26px;letter-spacing:1px}
.tword span{color:#9aa5b1;border-bottom:4px solid transparent}
.tword .ok{color:#3fb62c}
.tword .bad{color:#d62d20;background:#ffe0dc}
.tword .cur{color:var(--text);border-bottom-color:var(--blue-3)}
.ttyped{font:600 26px/1.3 ui-monospace,Menlo,Consolas,monospace;min-height:48px;padding:8px 14px;text-align:center;white-space:pre-wrap;word-break:break-word;
  background:#f5f8fb;border:2px solid #9aa5b1;border-radius:12px;box-shadow:inset 0 2px 4px rgba(0,0,0,.12)}
.ttyped::after{content:"▏";color:var(--blue-3);animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.ttyped .ok{color:#2f9a1f}
.ttyped .bad{color:#d62d20;background:#ffe0dc}
.tmsg{margin:0;text-align:center;min-height:24px;font-size:17px;color:var(--text-soft)}
.tmsg.warn{color:#d62d20;font-weight:600}
.thead{display:flex;justify-content:space-between;font-weight:600;font-size:17px}
.tstats{display:flex;justify-content:space-around;font-size:17px;color:var(--text)}
.terr{margin:0;color:#d62d20;min-height:22px;text-align:center;font-size:15px}
.tlock{max-width:420px;margin:0 auto;width:100%}
.tcount{margin:0;padding:30px 0;font-size:26px;font-weight:600;color:var(--blue-3)}
.tbig{font-size:26px;font-weight:700;margin:0;text-align:center}
.thands{max-width:520px;width:100%;margin:0 auto}
.thands svg{width:100%;height:auto;display:block}
.tkb{display:flex;flex-direction:column;gap:5px;padding:10px;border-radius:14px;background:#e3e9ef;border:1px solid #b5c0cc}
.tkrow{display:flex;gap:5px}
.key{flex:1;min-width:0;height:38px;display:grid;place-items:center;border-radius:8px;font-size:15px;font-weight:600;
  text-transform:uppercase;color:var(--text);background:linear-gradient(#fff,#dfe5eb);border:1px solid #9aa5b1;box-shadow:0 2px 0 #9aa5b1;transition:background .08s}
.key.wide{flex:2.6;font-size:13px;text-transform:none}.key.space{flex:6}
.key.next{background:#ffe48a;border-color:#d9a400}
.key.pulse{animation:pulse .7s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.key.down{background:linear-gradient(var(--blue-1),var(--blue-3));color:#fff;transform:translateY(2px);box-shadow:none}
.key.bad{background:#ff9a8f;border-color:#e5392b}
/* ===== MOUSE PRACTICE ===== */
.mcard{all:unset;cursor:pointer;box-sizing:border-box;width:220px;padding:14px;border-radius:16px;border:3px solid #9aa5b1;background:#f5f8fb;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:20px;font-weight:600}
.mcard:hover,.mcard:focus-visible{border-color:var(--blue-3);background:#e8f3ff}
.mcard svg{height:130px;width:auto}
.mrow{display:flex;gap:16px;align-items:center;padding:10px 14px;border-radius:14px;background:#f5f8fb;border:1px solid #d3dbe3}
.mrow svg{width:120px;height:auto;flex:none}
.mrow b{font-size:19px}.mrow p{margin:4px 0 0}
.mstage{position:relative;min-height:300px;flex:1;border-radius:14px;border:1px solid #b5c0cc;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:space-around;padding:14px;
  background:linear-gradient(#bfe6ff 60%,#bfe3a5 60%)}
.manimal{all:unset;cursor:pointer;font-size:88px;line-height:1;padding:8px 14px;border-radius:22px;user-select:none}
.manimal:hover,.manimal:focus-visible{background:rgba(255,255,255,.45)}
.mitems{display:flex;gap:28px;justify-content:center;align-items:center}
.mitem{font-size:64px;line-height:1;padding:6px;touch-action:none;cursor:grab;user-select:none;position:relative}
.mitem.held{z-index:30;cursor:grabbing;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}
.mitems.grid{display:grid;grid-template-columns:repeat(3,auto);gap:10px 40px}
.mitems.grid.small{grid-template-columns:repeat(4,auto);gap:6px 30px}
.mitems.grid.small .manimal{font-size:58px}
.wiggle{animation:wig .45s 3}
@keyframes wig{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg)}75%{transform:rotate(14deg)}}
.mbubble{position:absolute;transform:translate(-50%,-100%);z-index:25;background:#fff;border:2px solid #6d7b8a;border-radius:14px;padding:4px 12px;font-weight:600;white-space:nowrap}
.mmenu{position:absolute;z-index:40;display:flex;flex-direction:column;gap:5px;padding:7px;min-width:170px;background:#fff;border:1px solid #6d7b8a;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.35)}
/* ===== DOCK (minimized windows) AND PHONE SIZES ===== */
#dock{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:10px;padding:10px 16px;max-width:94vw;overflow-x:auto;z-index:9998;
  border-radius:22px;border:1px solid rgba(255,255,255,.7);background:linear-gradient(rgba(255,255,255,.55),rgba(255,255,255,.25));
  box-shadow:0 8px 24px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(8px)}
#dock:empty{display:none}
@media (max-width:600px){#desk{padding:14px;grid-template-columns:repeat(auto-fill,96px)} .menu-btn.hide-s{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
</style>
</head>

<div id="menu">
  <b id="site-name"></b>
  <button class="menu-btn" id="tile">Tile windows</button>
  <button class="menu-btn hide-s" id="closeall">Close all</button>
  <span class="clock" id="clock"></span>
</div>
<main id="desk" aria-label="Desktop"></main>
<nav id="dock" aria-label="Minimized windows"></nav>

<script>
/* ==========================================================
   1. YOUR CONTENT: edit only this part.

   Up to 10 folders (extra ones are ignored). Each folder has files.
   A file is written like this:

       ["File name", "what to open", "🖼️ icon (optional)", "note (optional)"]

   WHAT TO OPEN:
       online page:    "https://example.com/article"
       your own page:  "pages/lesson1.html"       (upload it next to index.html)
       a video:        "videos/mangroves.mkv"
       a picture:      "pictures/photo.jpg"       (.jpg .png .gif .webp .svg)
       empty:          ""   (shows a placeholder until you add something)

   ICON (optional): any emoji, for example "📰". Pictures get 🖼️ by default.

   NOTE (optional, any text that is not an emoji):
       for a picture it is the STARTING SUBTITLE under the picture
           ["Mangrove roots", "pictures/roots.jpg", "🖼️", "Roots protect the coast."]
       for a page or video it is the small hint at the bottom of the window.

   Subtitles are read-only: students cannot change them. To change a
   subtitle, edit the note here.

   Everything opens inside the window. This site never opens new tabs
   or popups. Some websites refuse to be shown inside another page and
   stay blank. For those, save a copy as your own file in pages/ and
   link that instead.
   ========================================================== */
const SITE = {
  name: "Grade 4’s Unit Article Hub",
  welcome: "Open a folder, then open a file. You can drag windows, resize them from the corner, and place them side by side.",
  practicePassword: "sharingtheplanet",   // 🔒 the password students type to open the practice games
  // 🔊 animal sounds: put your mp3 files in a folder called "sounds" and write the path, like bee: "sounds/bee.mp3". leave it empty and the animal just says "sound coming soon"
  mouse: {
    dragRounds: 8,    // how many "Feed the..." puzzles in level 1 (12 is the most)
    sounds: {bee:"sounds/beebuzz.wav", lion:"sounds/liongrowl.wav", mouse:"sounds/mousesqueak.mp3", dog:"sounds/dogbark.wav", cat:"sounds/catmeow.mp3", giraffe:"sounds/giraffehum.mp3", monkey:"sounds/monkeychirp.mp3", chicken:"sounds/chicken.mp3", bunny:"sounds/bunnysqueal.mp3", panda:"sounds/panda.mp3", penguin:"sounds/penguinsquawk.mp3", horse:"sounds/horse.mp3"}
  },
  // ⌨️ typing practice: only lowercase letters and spaces in the words and phrases please, no punctuation
  typing: {
    goalWpm: 12,          // words per minute that gets full speed points (lower = easier)
    levels: [
      {name:"Level 1 · Words", what:"short words", count:5,
       items:["impact","change","climate","mangrove","beach","forest","roots","dumping","landfill","coral","ocean","desert","trash","planet","glacier","reef"]},
      {name:"Level 2 · Big words", what:"longer words", count:5,
       items:["characteristic","ecosystem","conservation","environment","pollution","endangered","temperature","biodiversity","sustainable","rainforest","extinction","vegetation"]},
      {name:"Level 3 · Phrases", what:"full phrases", count:3,
       items:["mangrove roots protect the coast","coral reefs are home to many fish","trash in the ocean hurts animals","the amazon is a huge rainforest",
              "warm weather melts the glaciers","we must protect our planet","plants and animals need a healthy habitat","dumping trash harms the environment",
              "the atacama is a very dry desert","clean beaches help sea turtles","a landfill is where trash is buried"]}
    ],
    scoreNames: [["🌱","Little Seedling"],["🪴","Growing Sprout"],["🦀","Beach Crab"],["🐠","Reef Fish"],["🐢","Sea Turtle"],
                 ["🐬","Smart Dolphin"],["🦜","Rainforest Toucan"],["🐆","Swift Jaguar"],["🐋","Blue Whale"],["🌍","Planet Protector"]]
  },
  folders: [
    {
      name: "Mangroves",
      icon: "🌿",
      files: [
        ["Guayaquil, Ecuador", "pages/wetlands4.html", "📰"],
        ["Guayaquil, Ecuador", "pages/mangrove.html", "🔎"],
        ["What is a Mangrove?", "pages/dmangrove.html", "❓"],
        ["Gramacho, Brazil", "videos/mangroves.mkv", "🎬"],
        ["Picture 1", "images/mangrove1.jpg", "🖼️", "Mangrove in Bertioga, Brazil."],
        ["Picture 2", "images/mangrove2.webp", "🖼️", "Parque Estadual Restinga de Bertioga"],
        ["Picture 3", "images/mangrove3.jpg", "🖼️", "Mangroves are cut down and frequent trash dumping threatens the area's natural plant and wildlife."],
        ["Picture 4", "images/mangrove4.jpg", "🖼️", "Fisherman Hélio Ricardo in one of the few surviving mangrove areas in Complexo da Maré, Rio de Janeiro."]
        // ["File name", "what to open", "🖼️", "note"]   <- template

      ]
    },
    {
      name: "Coral Reefs",
      icon: "🪸",
      files: [
        ["Abrolhos, Brazil", "pages/folha4.html", "📰"],
        ["Abrolhos, Brazil", "pages/abrolhos.html", "🔎"],
        ["Coral Reefs and the People Who Changed Them", "pages/dreef.html", "❓"],
        ["Coral Reefs, Atlantic Ocean", "videos/corals.mkv", "🎬"],
        ["Picture 1", "images/coral1.jpg", "🖼️", "Snorkeling over elkhorn coral (Acropora palmata), a large, branching coral species vital to Caribbean reef ecosystems."],
        ["Picture 2", "images/coral2.jpg", "🖼️", "A colorful underwater world of Indo-Pacific corals and reef life."],
        ["Picture 3", "images/coral3.webp", "🖼️", "Heat stress forces corals to shed the algae that provide their food and color."],
        ["Picture 4", "images/coral2.webp", "🖼️", "A healthy coral colony (left) compared to a bleached coral colony (right) affected by warming ocean water."]
      ]
    },
    {
      name: "Forests",
      icon: "🌳",
      files: [
        ["Amazon Forest, Brazil", "pages/bbcamazon5.html", "📰"],
        ["Amazon Forest, Brazil", "pages/amazon.html", "🔎"],
        ["The Amazon Has a Long History", "pages/damazon.html", "❓"],
        ["Amazon Forest, Brazil", "videos/amazon.mkv", "🎬"],
        ["Picture 1", "images/amazon1.jpg", "🖼️", "Flooded igapó forest in the Brazilian Amazon, where rising river waters mirror the lush canopy above."],
        ["Picture 2", "images/amazon2.jpg", "🖼️", "Sunlight filters through the dense green canopy of a flooded igapó forest, casting mirror-like reflections on the calm dark waters."],
        ["Picture 3", "images/amazon3.jpg", "🖼️", "El Niño-driven extreme drought and forest fires in 2015-16 caused the loss of 3 billion trees"],
        ["Picture 4", "images/amazon4.jpg", "🖼️", "Fires burn through dense vegetation in the Amazon rainforest, releasing thick smoke and threatening native ecosystems."]
      ]
    },
    {
      name: "Deserts",
      icon: "🏜️",
      files: [
        ["Atacama Desert, Chile", "pages/npr4.html", "📰"],
        ["Atacama Desert, Chile", "pages/atacama.html", "🔎"],
        ["A Super Dry Place", "pages/datacama.html", "❓"],
        ["Atacama Desert, Chile", "videos/desert.mkv", "🎬"],
        ["Picture 1", "images/desert1.avif", "🖼️", "The sun shines on the rocky ridges of the Valley of the Moon in Chile's Atacama Desert."],

const $ = s => document.querySelector(s);
function h(tag, attrs = {}, ...kids){
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)){
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v);
  }
  kids.flat().forEach(c => el.append(c));
  return el;
}

let z = 10, nudge = 0;
const open = {};
const desk = $("#desk");

function focusWin(w){
  document.querySelectorAll(".win").forEach(x => x.classList.add("back"));
  w.classList.remove("back"); w.style.zIndex = ++z;
}

function makeWindow(id, title, content, opts = {}){
  if (open[id]){ open[id].hidden = false; refreshDock(); focusWin(open[id]); return open[id]; }
  const w = h("section", {class:"win" + (opts.viewer ? " viewer" : ""), role:"dialog", "aria-label":title});
  const close = h("button", {class:"dot x", "aria-label":"Close", onclick:() => { w.remove(); delete open[id]; refreshDock(); }});
  const mini  = h("button", {class:"dot m", "aria-label":"Minimize", onclick:() => { w.hidden = true; refreshDock(); }});
  const zoom  = h("button", {class:"dot z", "aria-label":"Maximize or restore", onclick:() => w.classList.toggle("full")});
  const bar = h("div", {class:"bar"}, h("div", {class:"dots"}, close, mini, zoom), h("h2", {}, title));
  const grip = h("div", {class:"grip", "aria-hidden":"true"});
  w.append(bar, h("div", {class:"body"}, content), grip);

  const dw = desk.clientWidth, dh = desk.clientHeight, n = (nudge++ % 6) * 28;
  const width = Math.min(opts.w || 460, dw - 16);
  w.style.width = width + "px";
  if (opts.h) w.style.height = Math.min(opts.h, dh - 16) + "px"; else w.style.maxHeight = (dh - 16) + "px";
  w.style.left = Math.max(8, Math.min(130 + n, dw - width - 8)) + "px";
  const winH = opts.h ? Math.min(opts.h, dh - 16) : 0;
  w.style.top = Math.max(8, Math.min(14 + n, dh - winH - 8)) + "px";
  w.dataset.kind = (opts.viewer || opts.tile) ? "viewer" : "folder";
  desk.append(w); open[id] = w; focusWin(w);
  if (opts.center){ w.style.left = Math.max(8, (dw - w.offsetWidth) / 2) + "px"; w.style.top = Math.max(8, (dh - w.offsetHeight) / 2) + "px"; }
  w.addEventListener("pointerdown", () => focusWin(w));

  let drag = null;
  bar.addEventListener("pointerdown", e => {
    if (e.target.closest(".dot") || w.classList.contains("full")) return;
    drag = {x:e.clientX - w.offsetLeft, y:e.clientY - w.offsetTop};
    bar.setPointerCapture(e.pointerId); document.body.classList.add("dragging");
  });
  bar.addEventListener("pointermove", e => {
    if (!drag) return;
    w.style.left = e.clientX - drag.x + "px";
    w.style.top = Math.max(0, e.clientY - drag.y) + "px";
  });
  const stopDrag = () => { drag = null; document.body.classList.remove("dragging"); };
  bar.addEventListener("pointerup", stopDrag); bar.addEventListener("pointercancel", stopDrag);

  let size = null;
  grip.addEventListener("pointerdown", e => {
    size = {x:e.clientX, y:e.clientY, w:w.offsetWidth, h:w.offsetHeight};
    w.style.maxHeight = "none"; grip.setPointerCapture(e.pointerId); document.body.classList.add("dragging"); e.stopPropagation();
  });
  grip.addEventListener("pointermove", e => {
    if (!size) return;
    w.style.width = Math.max(260, size.w + e.clientX - size.x) + "px";
    w.style.height = Math.max(180, size.h + e.clientY - size.y) + "px";
  });
  const stopSize = () => { size = null; document.body.classList.remove("dragging"); };
  grip.addEventListener("pointerup", stopSize); grip.addEventListener("pointercancel", stopSize);
  return w;
}

function openFile(file, i, k){

function tile(){
  const wins = Object.values(open).filter(w => !w.hidden && w.dataset.kind === "viewer");
  if (!wins.length) return;
  const dw = desk.clientWidth, dh = desk.clientHeight, g = 8;
  const cols = wins.length <= 3 ? wins.length : Math.ceil(Math.sqrt(wins.length));
  const rows = Math.ceil(wins.length / cols);
  const cw = (dw - g * (cols + 1)) / cols, ch = (dh - g * (rows + 1)) / rows;
  wins.forEach((w, n) => {
    w.classList.remove("full"); w.style.maxHeight = "none";
    w.style.width = cw + "px"; w.style.height = ch + "px";
    w.style.left = g + (n % cols) * (cw + g) + "px";
    w.style.top = g + Math.floor(n / cols) * (ch + g) + "px";
  });
}

function journalFile(ext){

  return "investigation-journal" + (safe ? "-" + safe : "") + (ext === "png" ? "-page" + (jpage + 1) : "") + "." + ext;
}
function saveBlob(blob, name){
  const url = URL.createObjectURL(blob);
  const a = h("a", {href:url, download:name});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function downloadJournal(){
  const text = "INVESTIGATION JOURNAL\nName: " + jname + "\n\n" + journal.map((p, i) =>
    "--- Page " + (i + 1) + " ---\n" + JOURNAL_FIELDS.map(([e, l]) => l + ": " + (p[l] || "")).join("\n")).join("\n\n") + "\n";
  saveBlob(new Blob([text], {type:"text/plain;charset=utf-8"}), journalFile("txt"));

function rr(ctx, x, y, w, hh, r){
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + hh, r); ctx.arcTo(x + w, y + hh, x, y + hh, r);
  ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function wrapText(ctx, text, maxW){
  const lines = [];
  String(text).split("\n").forEach(par => {
    let line = "";
    par.split(" ").forEach(word => {
      while (ctx.measureText(word).width > maxW){
        let i = word.length; while (i > 1 && ctx.measureText(word.slice(0, i)).width > maxW) i--;
        if (line){ lines.push(line); line = ""; }
        lines.push(word.slice(0, i)); word = word.slice(i);
      }
      const test = line ? line + " " + word : word;
      if (line && ctx.measureText(test).width > maxW){ lines.push(line); line = word; } else line = test;
    });
    lines.push(line);
  });
  return lines;
}
function paintJournal(ctx, W, H, draw){
  const F = '"Lucida Grande","Trebuchet MS","Segoe UI",Verdana,sans-serif';
  const M = 30, P = 32, BAR = 56, inner = W - 2 * M - 2 * P;
  ctx.textBaseline = "top";
  if (draw){
    const g = ctx.createLinearGradient(0, 0, W, H); g.addColorStop(0, "#6fb1e8"); g.addColorStop(1, "#2f78c4");
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "rgba(255,255,255,.07)"; for (let x = 0; x < W; x += 6) ctx.fillRect(x, 0, 2, H);
    rr(ctx, M, M, W - 2 * M, H - 2 * M, 22); ctx.fillStyle = "#fff"; ctx.fill();
    ctx.save(); rr(ctx, M, M, W - 2 * M, H - 2 * M, 22); ctx.clip();
    const b = ctx.createLinearGradient(0, M, 0, M + BAR); b.addColorStop(0, "#f4f4f4"); b.addColorStop(1, "#cfcfcf");
    ctx.fillStyle = b; ctx.fillRect(M, M, W - 2 * M, BAR); ctx.fillStyle = "#8f8f8f"; ctx.fillRect(M, M + BAR - 1, W - 2 * M, 1);
    ctx.restore();
    rr(ctx, M, M, W - 2 * M, H - 2 * M, 22); ctx.strokeStyle = "#6d7b8a"; ctx.lineWidth = 2; ctx.stroke();
    ["#e5392b", "#eba91a", "#3fb62c"].forEach((c, i) => { ctx.beginPath(); ctx.arc(M + 30 + i * 26, M + BAR / 2, 9, 0, Math.PI * 2); ctx.fillStyle = c; ctx.fill(); });
    ctx.fillStyle = "#1d2733"; ctx.font = "600 24px " + F; ctx.textAlign = "center"; ctx.fillText("Investigation Journal", W / 2, M + 16); ctx.textAlign = "left";
  }
  let y = M + BAR + P;
  ctx.font = "600 30px " + F; if (draw){ ctx.fillStyle = "#1d2733"; ctx.fillText("👤 Name: " + (jname || "________"), M + P, y); } y += 44;
  ctx.font = "22px " + F; if (draw){ ctx.fillStyle = "#5b6877"; ctx.fillText("Page " + (jpage + 1) + " of " + journal.length, M + P, y); } y += 48;
  JOURNAL_FIELDS.forEach(([e, l]) => {
    ctx.font = "600 28px " + F; if (draw){ ctx.fillStyle = "#1d2733"; ctx.fillText(e + " " + l, M + P, y); } y += 40;
    ctx.font = "26px " + F;
    const lines = wrapText(ctx, journal[jpage][l] || "", inner - 36), bh = Math.max(64, lines.length * 34 + 28);
    if (draw){
      rr(ctx, M + P, y, inner, bh, 14); ctx.fillStyle = "#f5f8fb"; ctx.fill(); ctx.strokeStyle = "#9aa5b1"; ctx.lineWidth = 2; ctx.stroke();
      ctx.fillStyle = "#1d2733"; lines.forEach((t, i) => ctx.fillText(t, M + P + 18, y + 14 + i * 34));
    }
    y += bh + 26;
  });
  return y - 26 + P + M;
}
function saveJournalPicture(){
  const W = 1000, H = paintJournal(document.createElement("canvas").getContext("2d"), W, 0, false);
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  paintJournal(c.getContext("2d"), W, H, true);
  c.toBlob(b => saveBlob(b, journalFile("png")), "image/png");
}

  const show = (...nodes) => root.replaceChildren(...nodes);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const flash = (el, cls, ms) => { if (!el) return; el.classList.add(cls); setTimeout(() => el.classList.remove(cls), ms); };

  let state = "lock", onEnter = null, busy = false, ui = {keys:{}};
  let plan = [], lv = 0, idx = 0, target = "", typed = "", startT = null;
  let elapsed = 0, attempts = 0, correct = 0, charsDone = 0;

  /* ---- first screen: where do my hands go? waits 3 seconds, then asks if they are ready ---- */
  function showHands(){
    state = "hands"; onEnter = null;
    const pic = h("div", {class:"thands"}); pic.innerHTML = handsSVG();
    const box = h("div", {style:"text-align:center;min-height:120px"});
    let n = 3;
    const setCount = () => box.replaceChildren(h("p", {class:"tcount"}, "Get ready… " + n));
    setCount();
    const tick = () => {
      if (!alive()) return;
      n--;
      if (n > 0){ setCount(); setTimeout(tick, 1000); } else showReady(box);
    };
    setTimeout(tick, 1000);
    show(
      h("div", {style:"text-align:center"}, h("p", {class:"big", style:"padding:0 0 6px"}, "✋ Where do my hands go?"),
        h("p", {class:"soft"}, "Rest your fingers on the middle row: A S D F and J K L ; — and your thumbs on the space bar.")),
      pic, box);
  }
  function showReady(box){
    state = "ready"; onEnter = startGame;
    box.replaceChildren(
      h("p", {class:"tbig"}, "Are you ready to start?"),
      h("p", {class:"soft", style:"margin:6px 0"}, "Tip: if you make a mistake, press Backspace ⌫ to erase it."),
      h("button", {class:"btn bigbtn", onclick:startGame}, "Yes, I’m ready! ▶"),
      h("p", {class:"soft", style:"font-size:14px"}, "(or press Enter)"));
  }

  /* ---- the game itself ---- */
  function startGame(){
    plan = CFG.levels.map(L => shuffle(L.items).slice(0, L.count));
    lv = 0; idx = 0; elapsed = 0; attempts = 0; correct = 0; charsDone = 0;
    showPlay();
  }

  function showPlay(){
    state = "play"; onEnter = null; busy = false;
    const L = CFG.levels[lv];
    const keys = {};
    const rows = ["1234567890".split("").concat(["Backspace"]), "qwertyuiop".split(""), "asdfghjkl".split(""), "zxcvbnm".split(""), [" "]];
    const kb = h("div", {class:"tkb", "aria-hidden":"true"}, rows.map((r, i) =>
      h("div", {class:"tkrow", style:"padding-left:" + (i === 2 ? "4%" : i === 3 ? "8%" : "0")},
        r.map(k => {
          const el = h("div", {class:"key" + (k === "Backspace" ? " wide" : "") + (k === " " ? " space" : "")},
            k === "Backspace" ? "⌫ Backspace" : k === " " ? "space" : k);
          keys[k] = el; return el;
        }))));
    const count = h("span", {});
    ui = {
      keys, count,
      prompt: h("div", {class:"tword", "aria-live":"polite"}),
      typedEl: h("div", {class:"ttyped", "aria-label":"What you typed"}),
      msg: h("p", {class:"tmsg", "aria-live":"polite"})
    };
    show(
      h("div", {class:"thead"}, h("span", {}, L.name), count),
      ui.prompt, ui.typedEl, ui.msg, kb,
      h("p", {class:"soft", style:"text-align:center;font-size:14px;margin:0"}, "Made a mistake? Press Backspace ⌫ to erase it."));
    loadItem();
  }

  function loadItem(){
    target = plan[lv][idx].toLowerCase(); typed = ""; startT = null; busy = false;
    ui.count.textContent = (idx + 1) + " of " + plan[lv].length;
    update();
  }

  function update(){
    const bad = [...typed].findIndex((c, i) => c !== target[i]);   // -1 means no mistakes yet
    ui.prompt.className = "tword" + (target.length > 16 ? " long" : "");
    ui.prompt.replaceChildren(...[...target].map((c, i) => {
      let cls = "";
      if (i < typed.length) cls = (bad === -1 || i < bad) ? "ok" : "bad";
      else if (i === typed.length) cls = "cur";
      return h("span", {class:cls}, c);
    }));
    ui.typedEl.replaceChildren(...[...typed].map((c, i) => h("span", {class:(bad === -1 || i < bad) ? "ok" : "bad"}, c)));
    Object.values(ui.keys).forEach(k => k.classList.remove("next", "pulse"));
    const want = bad !== -1 ? "Backspace" : target[typed.length];
    const wk = ui.keys[want];
    if (wk){ wk.classList.add("next"); if (bad !== -1) wk.classList.add("pulse"); }
    ui.msg.textContent = bad !== -1 ? "Oops! Press Backspace ⌫ to erase the red letters."
      : typed.length ? "Nice! Keep going. Follow the yellow key." : "Follow the yellow key!";
    ui.msg.className = "tmsg" + (bad !== -1 ? " warn" : "");
  }

  function finishItem(){
    busy = true; elapsed += performance.now() - startT; charsDone += target.length;
    ui.msg.className = "tmsg"; ui.msg.textContent = "🎉 Great job!";
    Object.values(ui.keys).forEach(k => k.classList.remove("next", "pulse"));
    setTimeout(() => {
      if (!alive()) return;
      idx++;
      if (idx < plan[lv].length) loadItem();
      else if (lv < CFG.levels.length - 1) showBetween();
      else showResults();
    }, 800);
  }

  function showBetween(){
    state = "between";
    const done = CFG.levels[lv], next = CFG.levels[lv + 1];
    const go = () => { lv++; idx = 0; showPlay(); };
    onEnter = go;
    show(h("div", {style:"text-align:center;padding:30px 0;display:flex;flex-direction:column;gap:10px;align-items:center"},
      h("p", {class:"tbig"}, "🎉 " + done.name + " complete!"),
      h("p", {style:"font-size:18px;margin:0"}, "Next: " + next.name),
      h("p", {class:"soft"}, "Type " + next.count + " " + next.what + "."),
      h("button", {class:"btn bigbtn", onclick:go}, "Start next level ▶"),
      h("p", {class:"soft", style:"font-size:14px;margin:0"}, "(or press Enter)")));
  }

  function showResults(){
    state = "done"; onEnter = null;
    const acc = attempts ? correct / attempts * 100 : 0;
    const mins = elapsed / 60000, wpm = mins > 0 ? (charsDone / 5) / mins : 0;
    const accPart = clamp((acc - 50) / 50, 0, 1), spdPart = clamp(wpm / CFG.goalWpm, 0, 1);
    const score = clamp(Math.round(1 + 9 * (0.6 * accPart + 0.4 * spdPart)), 1, 10);
    const [emo, name] = CFG.scoreNames[score - 1];
    show(h("div", {style:"text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;padding:6px 0"},
      h("p", {class:"big", style:"padding:0"}, "All levels complete!"),
      h("div", {style:"font-size:72px;line-height:1"}, emo),
      h("p", {class:"tbig"}, "Your score: " + score + " / 10"),
      h("p", {style:"font-size:24px;font-weight:600;margin:0;color:var(--blue-3)"}, name),
      h("div", {class:"tstats", style:"width:100%;max-width:420px;margin-top:8px"},
        h("span", {}, "🎯 Accuracy: " + Math.round(acc) + "%"),
        h("span", {}, "⚡ Speed: " + Math.round(wpm) + " words/min")),
      h("p", {class:"soft", style:"font-size:14px;max-width:420px"}, "Your score comes from how accurately you typed (60%) and how fast you typed (40%)."),
      h("div", {style:"display:flex;gap:10px;flex-wrap:wrap;justify-content:center"},
        h("button", {class:"btn bigbtn", onclick:startGame}, "Play again ↻"),
        h("button", {class:"btn light bigbtn", onclick:() => open.typing && open.typing.querySelector(".dot.x").click()}, "Finish"))));
  }

  /* ---- listens to the keys they press ---- */
  typingHandler = e => {
    const win = open.typing;
    if (!win || !alive()){ document.removeEventListener("keydown", typingHandler); if (typingSession === sid) typingHandler = null; return; }
    if (win.hidden || win.style.zIndex != z) return;                       // ignore the keys if another window is in front
    if (e.target.closest && e.target.closest("input,textarea")) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (state !== "play"){
      if (e.key === "Enter" && onEnter && !e.repeat){ e.preventDefault(); onEnter(); }
      return;
    }
    const k = e.key.length === 1 ? e.key.toLowerCase() : e.key;
    if (ui.keys[k]) e.preventDefault();
    if (busy) return;
    if (ui.keys[k] && (!e.repeat || k === "Backspace")) flash(ui.keys[k], "down", 120);
    if (k === "Backspace"){ if (typed){ typed = typed.slice(0, -1); update(); } return; }
    if (e.repeat || k.length !== 1 || typed.length >= target.length) return;
    if (startT === null) startT = performance.now();
    const clean = target.startsWith(typed);
    typed += k; attempts++;
    if (clean && k === target[typed.length - 1]) correct++; else flash(ui.keys[k], "bad", 250);
    update();
    if (typed === target) finishItem();
  };
  document.addEventListener("keydown", typingHandler);

  makeWindow("typing", "Typing practice", [root], {w:680, h:Math.min(660, desk.clientHeight - 24), center:true});
  showHands();
}

let lockBtn = null;
function openLock(){

// every animal and the food it likes: [animal emoji, animal name, food emoji, food name]
// want another animal? just add a line here (and its sound in SITE.mouse.sounds at the top)
const PAIRS = [
  ["🐝","bee","🍯","honey"], ["🦁","lion","🍖","meat"], ["🐭","mouse","🧀","cheese"], ["🐶","dog","🦴","bone"], ["🐱","cat","🐟","fish"],
  ["🦒","giraffe","🍃","leaves"], ["🐒","monkey","🍌","banana"], ["🐔","chicken","🌽","corn"], ["🐰","bunny","🥕","carrot"],
  ["🐼","panda","🥬","leafy green"], ["🐧","penguin","🐟","fish"], ["🐴","horse","🍎","apples"]
];
const M_LEVELS = ["Level 1 · Drag and drop", "Level 2 · Click and double-click", "Level 3 · The options menu", "Level 4 · Find the animal"];
const M_ACTIONS = [["drag"], ["click", "dbl"], ["menu"], ["menu"]];
const M_TITLE = {drag:"Drag and drop", click:"Click", dbl:"Double-click", menu:"Options menu (right-click)"};
const M_HOW = {
  drag:  {mouse:"Press and HOLD the left button on the item. Move the mouse. Let go to drop it.", pad:"Press and HOLD the pad down with one finger. Slide with another finger. Let go to drop it."},
  click: {mouse:"Press the left button one time.", pad:"Tap the pad one time with one finger."},
  dbl:   {mouse:"Press the left button two times, very fast.", pad:"Tap the pad two times, very fast."},
  menu:  {mouse:"Press the RIGHT button one time. A menu appears!", pad:"Tap the pad with TWO fingers at the same time (or press the bottom-right corner). A menu appears!"}
};
const M_HIT = {drag:"left", click:"left", dbl:"left", menu:"right"};

function deviceSVG(dev, act, x2){
  const on = "#ffcf3f", off = "#e6ebf0", tag = x2 ? '<text x="150" y="30" font-size="30" font-weight="700" fill="#e5392b" font-family="sans-serif">2×</text>' : "";
  if (dev === "mouse"){
    const L = act === "left" ? on : off, R = act === "right" ? on : off;
    return '<svg viewBox="0 0 190 160" role="img" aria-label="Computer mouse"><path d="M25 45 A35 35 0 0 1 58 10 L58 72 L25 72 Z" fill="' + L + '" stroke="#6d7b8a" stroke-width="3"/>' +
      '<path d="M62 10 A35 35 0 0 1 95 45 L95 72 L62 72 Z" fill="' + R + '" stroke="#6d7b8a" stroke-width="3"/>' +
      '<path d="M25 72 H95 V115 A35 35 0 0 1 60 150 A35 35 0 0 1 25 115 Z" fill="#f4f4f4" stroke="#6d7b8a" stroke-width="3"/>' +
      '<rect x="57" y="26" width="6" height="22" rx="3" fill="#9aa5b1"/><text x="41" y="64" font-size="10" text-anchor="middle" font-family="sans-serif">LEFT</text>' +
      '<text x="79" y="64" font-size="10" text-anchor="middle" font-family="sans-serif">RIGHT</text>' + tag + '</svg>';
  }
  const fing = c => '<circle cx="' + c + '" cy="103" r="10" fill="#ff7aa5" stroke="#c9396b" stroke-width="2"/>';
  return '<svg viewBox="0 0 190 150" role="img" aria-label="Laptop touchpad"><rect x="10" y="8" width="170" height="134" rx="12" fill="#cfd8e3" stroke="#6d7b8a" stroke-width="3"/>' +
    '<rect x="26" y="18" width="138" height="44" rx="5" fill="#fff" stroke="#9aa5b1"/><rect x="55" y="74" width="80" height="54" rx="8" fill="' + (act === "none" ? off : "#fff6cf") + '" stroke="#6d7b8a" stroke-width="2"/>' +
    (act === "left" ? fing(95) : act === "right" ? fing(83) + fing(107) : "") + tag + '</svg>';
}
const svgBox = html => { const d = h("div", {}); d.innerHTML = html; return d.firstChild; };

function openMouse(){
  if (open.mouse){ makeWindow("mouse", "Mouse practice", [], {}); return; }
  const root = h("div", {style:"display:flex;flex-direction:column;gap:12px"});
  const show = (...n) => root.replaceChildren(...n);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  let dev = "pad", lv = 0, mi = 0, missions = [], locked = false, menuEl = null, msgEl = null;
  // grabs n animals for the wrong answers, skipping any that eat the same food as p
  const wrongOnes = (p, n) => { const seen = new Set([p[2]]); return shuffle(PAIRS).filter(x => !seen.has(x[2]) && seen.add(x[2])).slice(0, n); };

  /* ---- first screen: mouse or touchpad? ---- */
  function showStart(){
    const card = (d, label) => h("button", {class:"mcard", onclick:() => { dev = d; startGame(); }}, svgBox(deviceSVG(d, "none")), label);
    show(h("p", {class:"big"}, "🖱️ Mouse practice"),
      h("p", {style:"text-align:center;font-size:20px;margin:0"}, "What are you using to move the pointer?"),
      h("div", {style:"display:flex;gap:16px;justify-content:center;flex-wrap:wrap"}, card("pad", "A touchpad"), card("mouse", "A mouse")),
      h("p", {class:"soft", style:"text-align:center"}, "Click the picture that looks like yours."));
  }
  function startGame(){
    const P = shuffle(PAIRS);
    missions = [P.slice(0, SITE.mouse.dragRounds || 8).map(p => ({type:"drag", p})),
                [0, 1, 2, 3].map(i => ({type:i % 2 ? "dbl" : "click", p:P[i]})),
                ["Make sound", "Wiggle", "Exit"].map((c, i) => ({type:"menu", p:P[i], choice:c})),
                [0, 1, 2, 3].map(i => ({type:"find", p:P[i + 4], choice:i % 2 ? "Wiggle" : "Make sound"}))];
    lv = 0; mi = 0; showIntro();
  }

  /* ---- before each level: explains how it works ---- */
  function showIntro(){
    show(h("p", {class:"big", style:"padding:0"}, M_LEVELS[lv]), h("p", {class:"soft", style:"text-align:center;margin:0"}, "Here is how it works:"),
      ...M_ACTIONS[lv].map(a => h("div", {class:"mrow"}, svgBox(deviceSVG(dev, dev === "pad" && a === "menu" ? "right" : M_HIT[a], a === "dbl")),
        h("div", {}, h("b", {}, (dev === "pad" && a === "menu") ? "Options menu (two-finger tap)" : M_TITLE[a]), h("p", {}, M_HOW[a][dev])))),
      h("div", {style:"text-align:center"}, h("button", {class:"btn bigbtn", onclick:showMission}, "Got it, let’s play! ▶")));
  }

  /* ---- game area ---- */
  const animal = p => h("button", {class:"manimal", "aria-label":p[1]}, p[0]);
  function bubble(stage, el, text){
    const r = el.getBoundingClientRect(), s = stage.getBoundingClientRect(), b = h("div", {class:"mbubble"}, text);
    b.style.left = (r.left - s.left + r.width / 2) + "px"; b.style.top = (r.top - s.top - 4) + "px";
    stage.append(b); setTimeout(() => b.remove(), 1600);
  }
  const wiggle = el => { el.classList.remove("wiggle"); void el.offsetWidth; el.classList.add("wiggle"); };
  function sound(stage, el, p){
    const src = (SITE.mouse.sounds || {})[p[1]];
    if (src){ const a = new Audio(src); a.play().catch(() => {}); bubble(stage, el, "🔊"); }
    else bubble(stage, el, "🔊 (sound coming soon)");
  }
  function closeMenu(){ if (menuEl){ menuEl.remove(); menuEl = null; } }
  function win(text){
    locked = true; msgEl.className = "tmsg"; msgEl.textContent = "🎉 " + text;
    setTimeout(() => {
      if (!open.mouse) return;
      mi++;
      if (mi < missions[lv].length) showMission();
      else if (lv < M_LEVELS.length - 1){ lv++; mi = 0; showIntro(); } else showDone();
    }, 1000);
  }
  const oops = text => { msgEl.className = "tmsg warn"; msgEl.textContent = text; };

  // the rightclick menu on an animal (m is the current puzzle, or nothing when they are just playing)
  function attachMenu(el, p, stage, m){
    el.addEventListener("contextmenu", e => {
      e.preventDefault(); if (locked) return; closeMenu();
      const r = stage.getBoundingClientRect(), pick = (choice, fn) => () => {
        closeMenu(); fn();
        if (m && (m.type === "menu" || m.type === "find")){
          if (p === m.p && choice === m.choice) win("You chose “" + choice + "”!");
          else if (p !== m.p) oops("That is the " + p[1] + ". Find the " + m.p[1] + "!");
          else if (choice !== "Exit") oops("Almost! Choose “" + m.choice + "”.");
        }
      };
      const opt = (label, fn) => h("button", {class:"btn light", role:"menuitem", onclick:fn}, label);
      menuEl = h("div", {class:"mmenu", role:"menu"},
        opt("🔊 Make sound", pick("Make sound", () => sound(stage, el, p))),
        opt("〰️ Wiggle", pick("Wiggle", () => wiggle(el))),
        opt("✖ Exit", pick("Exit", () => {})));
      menuEl.style.left = clamp(e.clientX - r.left, 4, r.width - 180) + "px";
      menuEl.style.top = clamp(e.clientY - r.top, 4, r.height - 150) + "px";
      stage.append(menuEl);
    });
  }

  // lets you drag a food onto an animal
  function attachDrag(item, target, ok, stage, p, q){
    let d = null;
    const back = () => { item.style.transition = "transform .3s"; item.style.transform = ""; item.classList.remove("held"); };
    item.addEventListener("pointerdown", e => { if (locked) return; item.setPointerCapture(e.pointerId); d = {x:e.clientX, y:e.clientY}; item.style.transition = "none"; item.classList.add("held"); });
    item.addEventListener("pointermove", e => { if (d) item.style.transform = "translate(" + (e.clientX - d.x) + "px," + (e.clientY - d.y) + "px)"; });
    item.addEventListener("pointercancel", () => { d = null; back(); });
    item.addEventListener("pointerup", e => {
      if (!d) return; d = null;
      const r = target.getBoundingClientRect();
      const hit = e.clientX > r.left - 12 && e.clientX < r.right + 12 && e.clientY > r.top - 12 && e.clientY < r.bottom + 12;
      if (hit && ok){ item.remove(); wiggle(target); bubble(stage, target, "😋 Yum!"); win("The " + p[1] + " loves the " + p[3] + "!"); }
      else { back(); oops(hit ? "The " + p[1] + " does not want the " + q + ". Try another one!" : "Drop it on the " + p[1] + "!"); }
    });
  }

  /* ---- one puzzle ---- */
  function showMission(){
    const m = missions[lv][mi], p = m.p; locked = false; menuEl = null;
    const stage = h("div", {class:"mstage"});
    stage.addEventListener("pointerdown", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
    msgEl = h("p", {class:"tmsg"}, M_HOW[m.type === "find" ? "menu" : m.type][dev]);   // level 4 uses the same right-click help
    const task = {drag:"Feed the " + p[1] + "!", find:"Make the " + p[1] + (m.choice === "Wiggle" ? " wiggle!" : " make a sound!"), click:"Click the " + p[0] + " " + p[1] + "!",
                  dbl:"Double-click the " + p[0] + " " + p[1] + "!", menu:"Open the " + p[1] + "’s menu, then choose “" + m.choice + "”!"}[m.type];
    show(h("div", {class:"thead"}, h("span", {}, M_LEVELS[lv]), h("span", {}, (mi + 1) + " of " + missions[lv].length)),
      h("p", {class:"tbig", style:"font-size:23px"}, task), stage, msgEl);

    if (m.type === "drag"){
      const a = animal(p); attachMenu(a, p, stage, m);
      const items = shuffle([p, ...wrongOnes(p, 2)]).map(x => {
        const it = h("div", {class:"mitem", draggable:"false", "aria-label":x[3]}, x[2]);
        attachDrag(it, a, x[2] === p[2], stage, p, x[3]); return it;
      });
      stage.append(a, h("div", {class:"mitems"}, items));
    } else if (m.type === "find"){
      const six = shuffle([p, ...shuffle(PAIRS.filter(x => x !== p)).slice(0, 5)]);
      stage.append(h("div", {class:"mitems grid"}, six.map(x => { const a = animal(x); attachMenu(a, x, stage, m); return a; })));
    } else if (m.type === "menu"){
      const a = animal(p); attachMenu(a, p, stage, m); stage.append(a);
    } else {
      const row = h("div", {class:"mitems"}, shuffle([p, ...shuffle(PAIRS.filter(x => x !== p)).slice(0, 2)]).map(x => {
        const a = animal(x); attachMenu(a, x, stage, m);
        a.addEventListener("click", e => {
          if (locked || e.detail > 1) return;
          if (x !== p) oops("That is the " + x[1] + ". Find the " + p[1] + "!");
          else if (m.type === "click") win("Yes! That is the " + p[1] + "!");
          else oops("Almost! Press two times, very fast.");
        });
        a.addEventListener("dblclick", () => {
          if (locked || m.type !== "dbl") return;
          if (x === p) win("Double-click! Great!"); else oops("That is the " + x[1] + ". Find the " + p[1] + "!");
        });
        return a;
      }));
      stage.append(row);
    }
  }

  /* ---- all done! they can play with the animals ---- */
  function showDone(){
    locked = false; menuEl = null;
    const stage = h("div", {class:"mstage"});
    stage.addEventListener("pointerdown", e => { if (menuEl && !menuEl.contains(e.target)) closeMenu(); });
    stage.append(h("div", {class:"mitems grid small"}, PAIRS.map(p => { const a = animal(p); attachMenu(a, p, stage, null); return a; })));
    show(h("p", {class:"big", style:"padding:0"}, "🏆 You did it! You are a Mouse Master!"),
      h("p", {class:"soft", style:"text-align:center;margin:0"}, "Play with the animals: " + M_HOW.menu[dev]), stage,
      h("div", {style:"display:flex;gap:10px;justify-content:center;flex-wrap:wrap"},
        h("button", {class:"btn bigbtn", onclick:startGame}, "Play again ↻"),
        h("button", {class:"btn light bigbtn", onclick:() => open.mouse && open.mouse.querySelector(".dot.x").click()}, "Finish")));
  }

  makeWindow("mouse", "Mouse practice", [root], {w:720, h:Math.min(680, desk.clientHeight - 24), center:true});
  showStart();
}
